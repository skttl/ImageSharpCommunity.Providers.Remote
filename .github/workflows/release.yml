name: Release Package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, including v or umb-v prefix
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "umb-v[0-9]+.[0-9]+.[0-9]+*"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Select package and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            umb-v*)
              VERSION="${RELEASE_TAG#umb-v}"
              PROJECT="src/Umbraco.Community.ImageSharpRemoteImages/Umbraco.Community.ImageSharpRemoteImages.csproj"
              PACKAGE_ID="Umbraco.Community.ImageSharpRemoteImages"
              ;;
            v*)
              VERSION="${RELEASE_TAG#v}"
              PROJECT="src/ImageSharpCommunity.Providers.Remote/ImageSharpCommunity.Providers.Remote.csproj"
              PACKAGE_ID="ImageSharpCommunity.Providers.Remote"
              ;;
            *) echo "Expected a v or umb-v release tag" >&2; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Pack release
        run: dotnet pack "$PROJECT" --configuration Release -p:Version="$VERSION" --output ./artifacts
      - name: NuGet login with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: skttl
      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/${PACKAGE_ID}.${VERSION}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate --source https://api.nuget.org/v3/index.json
