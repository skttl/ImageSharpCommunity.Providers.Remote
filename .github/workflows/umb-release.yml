name: Release Umbraco Package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag version without its prefix
        required: true
        type: string
  push:
    tags:
      - "umb-v[0-9]+.[0-9]+.[0-9]+"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/umb-v{0}', inputs.version) || github.ref }}
    - name: Set VERSION variable
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/umb-v}}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid package version" >&2
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Output version name
      run: echo "${VERSION}"
    - name: Cancel job if version is empty
      if: ${{ env.VERSION == '' }}
      run: exit 1
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Build Umbraco Package
      run: dotnet pack ./src/Umbraco.Community.ImageSharpRemoteImages/Umbraco.Community.ImageSharpRemoteImages.csproj /p:NuGetVersion=${VERSION} /p:Version=${VERSION} --output . --configuration Release
    - name: Pack
      run: dotnet pack ./src/Umbraco.Community.ImageSharpRemoteImages/Umbraco.Community.ImageSharpRemoteImages.csproj /p:NuGetVersion=${VERSION} /p:Version=${VERSION} --output . --configuration Release --no-build
    - name: NuGet login with OIDC
      id: login
      uses: NuGet/login@v1
      with:
        user: skttl
    - name: Push to NuGet
      run: dotnet nuget push "./Umbraco.Community.ImageSharpRemoteImages.${VERSION}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate --source https://api.nuget.org/v3/index.json
